query CartInput($tag: String!) {
  cart {
    buyerIdentity {
      customer {
        hasTags(tags: [$tag]) {
          hasTag
        }
      }
    }
    lines {
      id
      quantity
      merchandise {
        __typename
        ... on ProductVariant {
          product {
            id
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "tier-config") {
      jsonValue
    }
  }
}
